<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anything Download</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 20h14" /></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 16v-4m0-4h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z" /></symbol>
      <symbol id="i-error" viewBox="0 0 24 24"><path d="m15 9-6 6m0-6 6 6m7-3a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l5-5 4 4 2-2 5 5" /></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><path d="M3 6h13v12H3zm13 4 5-3v10l-5-3" /></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v4h4M9 13h6m-6 4h6" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9M18 14v6H4V6h6" /></symbol>
    </svg>

    <header class="bar">
      <div class="brand">
        <img class="mark" src="../icons/icon-48.png" width="28" height="28" alt="" />
        <span class="brand-name">Anything <span class="brand-accent">Download</span></span>
      </div>
      <button id="settings" class="icon-button" type="button" aria-label="Extension settings">
        <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
      </button>
    </header>

    <main>
      <section class="page" aria-labelledby="page-label">
        <h1 id="page-label" class="eyebrow">Current page</h1>
        <p id="page-host" class="page-host">&nbsp;</p>
        <p id="page-url" class="page-url">&nbsp;</p>
      </section>

      <button id="analyze" class="button primary" type="button" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span class="label">Analyze this page</span>
      </button>

      <section id="result" class="result" aria-live="polite" aria-busy="false" hidden>
        <div id="skeleton" class="skeleton" hidden>
          <span></span><span></span><span></span>
        </div>
        <div id="panel" class="panel" hidden>
          <div class="panel-head">
            <svg id="tone-icon" class="icon tone-icon" aria-hidden="true"><use href="#i-info" /></svg>
            <h2 id="heading" class="heading"></h2>
          </div>
          <p id="message" class="message"></p>
          <p id="detail" class="detail" hidden></p>
          <ul id="actions" class="actions" aria-label="Available on this page"></ul>
          <div class="panel-foot">
            <button id="retry" class="button secondary" type="button" hidden>Try again</button>
          </div>
        </div>
      </section>

      <button id="open-site" class="button link" type="button" disabled>
        <span class="label">Open in Anything Download</span>
        <svg class="icon" aria-hidden="true"><use href="#i-external" /></svg>
      </button>
    </main>

    <footer class="foot">
      <p>The page address is sent only when you choose an action. No cookies, no history, no tracking.</p>
    </footer>
  </body>
</html>
