# Grouped monthly updates keep dependency pull requests small in number.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
