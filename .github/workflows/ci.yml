name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only checks out, builds and tests; nothing needs a writable token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  AD_ENV: test
  AD_RATE_LIMIT_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  PNPM_HOME: /home/runner/setup-pnpm
  PLAYWRIGHT_BROWSERS_PATH: 0

# Third-party actions are pinned to commit SHAs (tags are mutable); the version each
# SHA corresponds to is noted beside it.
jobs:
  api:
    name: API lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/api
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        working-directory: apps/api
        run: mypy src/anything_download
      - name: Pytest (FFmpeg-dependent tests run here; FFmpeg is installed above)
        working-directory: apps/api
        run: pytest -q --cov=anything_download --cov-report=term-missing -m "not external and not browser"

  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anything-download/web lint
      - run: pnpm --filter @anything-download/web typecheck
      - run: pnpm --filter @anything-download/web build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: Web + API e2e against the production build (no third-party sites)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AD_ENV: test
      AD_REDIS_URL: redis://localhost:6379/0
      AD_STORAGE_DIR: /tmp/ad-e2e-storage
      AD_ALLOW_PRIVATE_TARGETS: "false"
      AD_RATE_LIMIT_ENABLED: "true"
      AD_RATE_LIMIT_ANALYZE_PER_MINUTE: "8"
      AD_ENABLE_BROWSER_TOOLS: "false"
      AD_ENABLE_DOCS: "false"
      AD_LOG_LEVEL: WARNING
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      E2E_API: "1"
      # With CI set, this makes Playwright use the server started below instead of
      # `next dev`. The dev server hid a production-only hydration failure before.
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Start API, worker and cleanup
        working-directory: apps/api
        run: |
          mkdir -p /tmp/ad-e2e-storage
          nohup python -m uvicorn anything_download.main:app --host 127.0.0.1 --port 8000 > /tmp/ad-api.log 2>&1 &
          nohup python -m anything_download.workers.worker > /tmp/ad-worker.log 2>&1 &
          nohup python -m anything_download.workers.cleanup > /tmp/ad-cleanup.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy"
          cat /tmp/ad-api.log
          exit 1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anything-download/web exec playwright install --with-deps chromium
      - name: Build and start the production web server
        run: |
          pnpm --filter @anything-download/web build
          nohup pnpm --filter @anything-download/web start > /tmp/ad-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Web server failed to start"
          cat /tmp/ad-web.log
          exit 1
      - run: pnpm --filter @anything-download/web test:e2e
      - name: Service logs on failure
        if: failure()
        run: tail -n 200 /tmp/ad-api.log /tmp/ad-worker.log /tmp/ad-web.log || true

  docker:
    name: Docker images and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Validate the production overlay and Caddyfile
        run: |
          AD_DOMAIN=ci.example.test docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker run --rm -e AD_DOMAIN=ci.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Image vulnerability scan (fails on fixable HIGH/CRITICAL)
        # Findings with no upstream fix are reported but do not fail the build; see
        # docs/engineering/threat-model.md for the accepted residual risk.
        run: |
          for image in anything-download-api:latest anything-download-web:latest; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock               aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7               image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Smoke test (real Redis, worker and FFmpeg)
        run: |
          set -euo pipefail
          ready=$(curl -sf http://localhost:8000/api/v1/ready)
          echo "$ready"
          echo "$ready" | grep -q '"redis":true'
          echo "$ready" | grep -q '"ffmpeg":true'
          # Browsers reach the API through the web container's proxy.
          curl -sf http://localhost:3000/api/v1/health >/dev/null
          # Redis must only be bound to loopback.
          docker compose port redis 6379 | grep -q '^127.0.0.1:'
          job=$(curl -sf -X POST http://localhost:8000/api/v1/jobs -H 'Content-Type: application/json' \
            -d '{"tool":"qr-generator","input":{"kind":"text","text":"ci smoke"}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 60); do
            status=$(curl -sf "http://localhost:8000/api/v1/jobs/$job" | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
            [ "$status" = COMPLETED ] && break
            [ "$status" = FAILED ] && { echo "job failed"; exit 1; }
            sleep 1
          done
          [ "$status" = COMPLETED ]
          curl -sf -o /tmp/qr.png "http://localhost:8000/api/v1/jobs/$job/result"
          file /tmp/qr.png | grep -q 'PNG image'
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit (API runtime dependencies)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --skip-editable
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  extension:
    name: Chrome extension (typecheck, unit, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anything-download/extension typecheck
      - name: Unit tests (includes the manifest permission/privacy guard)
        run: pnpm --filter @anything-download/extension test:unit
      # Extensions need the full Chromium build, not the headless shell.
      - run: pnpm --filter @anything-download/extension exec playwright install --with-deps chromium
      - name: Browser tests against a local mock API (no third-party sites)
        run: pnpm --filter @anything-download/extension test:e2e
