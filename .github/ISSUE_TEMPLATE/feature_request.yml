name: Feature request
description: Suggest a new tool or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Anything Download only works with publicly accessible content that users have the
        right to process. Requests to bypass DRM, logins, paywalls, CAPTCHAs or other access
        controls will be closed.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the tool or feature do? What input does it take and what does it produce?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This works with public content only and does not bypass any access control.
          required: true
