name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        **Security issues must not be reported here.** Follow SECURITY.md instead.
        Please do not paste private links, personal files, cookies or tokens.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool or page, for example "Video to MP3" or the home page.
  - type: textarea
    id: source
    attributes:
      label: Public example source
      description: A public link or a description of the file type that reproduces the problem. Only share content that is public.
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - Self-hosted with Docker
        - Local development
        - Chrome extension
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 128 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: The error shown in the page, or relevant API or worker log lines. Remove any URLs you do not want to share.
      render: text
